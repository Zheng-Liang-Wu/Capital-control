<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>資金配置｜資金管控儀表板</title>
  <link rel="stylesheet" href="styles.css?v=48f4143">
  <script src="config.js?v=48f4143"></script>
  <script src="app.js?v=48f4143" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Capital Management 首頁">CAPITAL MANAGEMENT</a>
      <div class="top-actions"><span class="updated" id="updated">等待同步</span><button class="refresh-button" id="refresh-button" type="button" aria-label="立即更新試算表資料">↻ 更新</button><a class="form-link" id="form-link" href="#" target="_blank" rel="noreferrer">開啟試算表 ↗</a></div>
    </header>

    <span id="data-status" class="sr-only" aria-live="polite">等待同步</span>

    <section class="summary-grid" aria-label="資金總覽">
      <article class="summary-card total-card"><div class="card-label">總本金 <span class="label-icon">↗</span></div><div class="total-value" id="total-capital">—</div><div class="metric-foot twd-line" id="capital-twd">約 NT$ —</div><div class="card-foot">依試算表最新一列</div></article>
      <article class="summary-card"><div class="card-label">現貨 <span class="label-icon">◇</span></div><div class="metric-value" id="spot-amount">—</div><div class="metric-foot twd-line" id="spot-twd">約 NT$ —</div><div class="metric-foot" id="spot-ratio">—</div><div class="metric-foot" id="spot-state">最低配置 70%</div></article>
      <article class="summary-card"><div class="card-label">合約長線倉位 <span class="label-icon">↗</span></div><div class="metric-value" id="long-amount">—</div><div class="metric-foot twd-line" id="long-twd">約 NT$ —</div><div class="metric-foot" id="long-ratio">—</div></article>
      <article class="summary-card"><div class="card-label">合約波段倉位 <span class="label-icon">⌁</span></div><div class="metric-value" id="trend-amount">—</div><div class="metric-foot twd-line" id="trend-twd">約 NT$ —</div><div class="metric-foot" id="trend-ratio">—</div></article>
      <article class="summary-card reserve-card"><div class="card-label">U 倉 <span class="label-icon">Ｕ</span></div><div class="metric-value" id="reserve-value">—</div><div class="metric-foot" id="reserve-twd">約 NT$ —</div><div class="metric-foot" id="reserve-ratio">—</div></article>
    </section>

    <section class="allocation-section">
      <div class="section-heading"><div><p class="eyebrow">PORTFOLIO</p><h2>資金配置</h2></div><div class="basis-chip"><span></span> 各倉金額 / 總本金</div></div>
      <div class="allocation-layout">
        <article class="allocation-card">
          <div class="allocation-top"><div><span class="small-label">資金分布</span><h3>本金配置比例</h3></div><span class="total-pill" id="allocation-total">本金 —</span></div>
          <div class="bar-track" id="bar-track" aria-label="各倉位資金分布"></div>
          <div class="legend" id="legend"></div>
          <div class="allocation-foot"><span>現貨下限參考</span><div class="threshold"><span></span><b>70%</b><i></i></div><span>100%</span></div>
        </article>
        <article class="positions-card"><div class="positions-heading"><h3>各倉位明細</h3><span>金額 / 占本金</span></div><div id="positions"></div><div class="unallocated-row"><div class="position-name"><span class="position-icon">＋</span><span>尚未分配</span></div><div class="position-value"><b id="unallocated-value">—</b><span id="unallocated-ratio">—</span></div></div></article>
      </div>
    </section>

    <footer><span>資料以試算表最新一列為準。</span><span id="source-note">台幣為估算值：1 USDT ≈ NT$31.8</span></footer>
  </main>
</body>
</html>
